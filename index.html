<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUJARAT TAXI HUB</title>

<style>
:root {
  --yellow: #ffd52a;
  --black: #090909;
  --card: #161616;
  --muted: #bdbdbd;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--black);
  color: white;
  font-family: Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #090909;
  border-bottom: 1px solid #333;
  padding: 15px 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: clamp(17px, 3.8vw, 26px);
  font-weight: 900;
  color: var(--yellow);
  text-decoration: none;
}

.btn {
  background: var(--yellow);
  color: #111;
  border: 0;
  border-radius: 12px;
  padding: 14px 17px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 24px 16px;
}

.eyebrow {
  color: var(--yellow);
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(30px, 5vw, 44px);
  margin: 8px 0;
}

.intro {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 24px;
}

.cars {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.car {
  background: var(--card);
  border: 1px solid #333;
  border-radius: 20px;
  overflow: hidden;
  min-width: 0;
}

.photo {
  height: 190px;
  position: relative;
  background: #242424;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.view {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #050505e8;
  border: 1px solid #777;
  color: white;
  border-radius: 24px;
  padding: 9px 12px;
  cursor: pointer;
}

.fallback {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: white;
  background: #242424;
  font-weight: bold;
}

.carbody {
  padding: 16px;
  display: flex;
  flex-direction: column;
  min-height: 210px;
}

h2 {
  font-size: 21px;
  line-height: 1.35;
  margin: 0 0 8px;
}

.desc {
  color: var(--muted);
  line-height: 1.55;
  flex: 1;
}

.model {
  font-size: 13px;
  color: var(--yellow);
  margin-bottom: 13px;
}

.select {
  background: transparent;
  border: 2px solid var(--yellow);
  border-radius: 12px;
  color: var(--yellow);
  font-size: 15px;
  font-weight: bold;
  padding: 13px 8px;
  width: 100%;
  cursor: pointer;
}

.note {
  margin: 20px 0;
  background: #181818;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 13px;
  color: #ccc;
  font-size: 13px;
  line-height: 1.6;
}
